- name: Bootstrap fresh install with packages, service user, and WireGuard
  hosts: servers
  gather_facts: false
  become: true

  vars:
    ansible_user: "{{ admin_user }}"
  #
  #
  # !!!!!!! MAKE SURE TO RUN THIS PLAY WITH THE -Kk FLAG SO ANSIBLE PROMPTS FOR THE SUDO AND SSH PASSWORDS !!!!!!!
  #
  #

  roles:
    - lan_shoehorn
    - service_user
    - base_pkg_install 

  tasks:

    - name: Configure WireGuard
      ansible.builtin.include_role:
        name: network_configuration
        tasks_from: wireguard
