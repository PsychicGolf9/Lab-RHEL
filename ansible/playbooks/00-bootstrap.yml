- name: Bootstrap fresh install to set up user for Ansible
  hosts: servers
  gather_facts: true

  vars:
    ansible_user: "{{ admin_user }}"
  #
  #
  # !!!!!!! MAKE SURE TO RUN THIS PLAY WITH THE -Kk FLAG SO ANSIBLE PROMPTS FOR THE SUDO AND SSH PASSWORDS !!!!!!!
  #
  #

  roles:
    - wg_check
    - user_a
