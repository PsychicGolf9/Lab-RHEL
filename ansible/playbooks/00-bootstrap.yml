- name: Bootstrap fresh install to set up user for Ansible
  hosts: servers
  gather_facts: true

  vars:
    ansible_user: "{{ bootstrap_user }}"
    ansible_host: rhel-lab00-admin

  #
  #
  # !!!!!!! MAKE SURE TO RUN THIS PLAY WITH THE -K FLAG SO ANSIBLE PROMPTS FOR THE SUDO PASSWORD !!!!!!!
  #
  #

  roles:
    - user_a
