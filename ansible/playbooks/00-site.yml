- name: Install baseline packages and configure SSH
  hosts: servers
  become: true
  gather_facts: true

  tasks:
    - name: Install required packages
      ansible.builtin.dnf:
        name: "{{ packages_to_install }}"
        state: present
      register: pkg_install

    - name: Ensure SSH port is set
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?Port "
        line: "Port {{ ssh_port }}"
        state: present
      notify: Restart sshd

    - name: Create welcome file
      ansible.builtin.copy:
        dest: /root/welcome.txt
        content: "Welcome to {{ inventory_hostname }}!\n Installed by {{ ansible_user }}."
        mode: '0644'
        owner: root
        group: root
      notify: Restart sshd

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
