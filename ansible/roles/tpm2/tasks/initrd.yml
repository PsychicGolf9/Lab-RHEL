- name: Create dracut config directory
  ansible.builtin.file:
    path: /etc/dracut.conf.d
    state: directory
    mode: '0700'
    owner: root
    group: root

- name: Deploy dracut config
  ansible.builtin.template:
    src: dracut-tpm2.conf.j2
    dest: /etc/dracut.conf.d/90-tpm.conf
    mode: '0600'
    owner: root
    group: root
  notify: regenerate all

- name: Check if rd.luks.options is already present in kernel cmdline
  ansible.builtin.command:
    argv:
      - grubby
      - --info=ALL
  register: tpm2_grubby_info
  changed_when: false
  check_mode: false

- name: Add rd.luks.options to kernel cmdline if missing
  ansible.builtin.command:
    argv:
      - grubby
      - --update-kernel=ALL
      - --args=rd.luks.options=tpm2-device=auto
  when: "'rd.luks.options=tpm2-device=auto' not in tpm2_grubby_info.stdout"
  notify: regenerate all
  changed_when: true

- name: Verify dracut file exists and is readable
  ansible.builtin.stat:
    path: /etc/dracut.conf.d/90-tpm.conf
  register: tpm2_dracut_stat
  changed_when: false

- name: Assert dracut config was deployed successfully
  ansible.builtin.assert:
    that:
      - tpm2_dracut_stat.stat.exists
      - tpm2_dracut_stat.stat.mode == '0600'
    success_msg: "Dracut configuration verified at {{ tpm2_dracut_stat.stat.path }}"
    fail_msg: >-
      {{ inventory_hostname }}: Dracut configuration file failed to deploy or has incorrect permissions.
      Initramfs will not be regenerated.
  changed_when: false

- name: Warn that reboot is required for changes to take effect
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: TPM configuration complete.
      Initramfs will be regenerated when handler executes.
      A reboot is required to test automatic unlocking.
      DO NOT reboot until you have console access.
  changed_when: false
