- name: Restart NetworkManager
  become: true
  ansible.builtin.service:
    name: NetworkManager
    state: restarted
  listen: restart networkmanager

- name: Restart wg-quick
  ansible.builtin.systemd:
    name: wg-quick@wg0
    state: restarted
  listen: restart wg-quick

- name: Reload Firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: reloaded
  listen: reload firewalld

- name: Reload sshd
  ansible.builtin.systemd:
    name: sshd
    state: reloaded
  listen: reload sshd
