- name: Disable NetworkManager wifi.powersave
  become: true

  block:
    - name: Ensure NetworkManager conf.d exists
      ansible.builtin.file:
        path: /etc/NetworkManager/conf.d
        state: directory
        mode: '0755'

    - name: Create Drop In File To Disable Wifi-Powersaving
      ansible.builtin.copy:
        dest: /etc/NetworkManager/conf.d/99-wifi-powersave.conf
        content: |
          [connection]
          wifi.powersave = 2
        mode: '0644'
      notify: restart networkmanager
